{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="auth-screen">
  <div class="auth-card" style="text-align:center;">
    <div class="auth-mark">{{ '⚠️' if code == 500 else '🔍' }}</div>
    <h1>{{ code }}</h1>
    <p class="auth-sub">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-block" style="margin-top:16px; display:inline-block; text-decoration:none;">Back to safety</a>
  </div>
</div>
{% endblock %}
