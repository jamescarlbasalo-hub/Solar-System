{% extends "base.html" %}
{% block title %}Sign up — SchoolSync{% endblock %}
{% block content %}
<div class="auth-screen">
  <div class="auth-card">
     <img src="{{ url_for('static', filename = 'css/CKCM_LOGO_JAMESCARL.png') }}" alt="SchoolSync Logo" class="auth-logo">
    <h1>Create your account</h1>
    <p class="auth-sub">Sign up as a student to view the calendar and announcements.</p>

    <form method="POST" action="{{ url_for('signup') }}" class="auth-form">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" value="{{ name }}" placeholder="e.g. Liza Fernandez" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" placeholder="you@school.edu" required>
      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="password-toggle" aria-label="Show password">
          <svg class="icon-eye" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>  

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="switch-auth">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
