{% extends "base.html" %}
{% block title %}Log in — SchoolSync{% endblock %}
{% block content %}
<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-mark">
      <img src="{{ url_for('static', filename = 'css/CKCM_LOGO_JAMESCARL.png') }}" alt="SchoolSync Logo" class="auth-logo">
    </div>
    <h1>SchoolSync</h1> 
    <p class="auth-sub">School Event Calendar &amp; Announcement System</p>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="e.g. admin@schoolsync.edu" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>

      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <p class="switch-auth">New here? <a href="{{ url_for('signup') }}">Create a student account</a></p>
  </div>
</div>
{% endblock %}
